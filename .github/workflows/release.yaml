name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (vX.Y.Z-rc.N or vX.Y.Z)
        required: true
        default: v0.0.1-rc.1
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate version
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?\z') {
            throw 'Version must be vX.Y.Z-rc.N or vX.Y.Z.'
          }
          if ([bigint]$Matches[1] -gt 255 -or [bigint]$Matches[2] -gt 255 -or
              [bigint]$Matches[3] -gt 654 -or
              ($Matches[4] -and [bigint]$Matches[4].Substring(4) -gt 98)) {
            throw 'MSI versions require major/minor <= 255, patch <= 654, and RC 1..98.'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check source
        run: |
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) { $unformatted; throw 'Run gofmt on the files above.' }
      - name: Build and package Windows
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
        run: |
          $name = "dscd-$env:RELEASE_VERSION-windows-amd64"
          $package = Join-Path $env:RUNNER_TEMP $name
          $bin = Join-Path $package 'bin'
          $docs = Join-Path $package 'docs'
          $packaging = Join-Path $package 'packaging'
          $windows = Join-Path $packaging 'windows'
          $dist = Join-Path $env:RUNNER_TEMP 'release-dist'
          New-Item -ItemType Directory -Path $bin, $docs, $windows, $dist -Force | Out-Null
          $executable = Join-Path $bin 'dscd.exe'
          go build -trimpath -o $executable ./cmd/dscd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $executable -help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md, LICENSE, AGENTS.md -Destination $package
          Copy-Item (Join-Path 'docs' 'design.md') -Destination $docs
          Copy-Item packaging/windows/install.ps1, packaging/windows/uninstall.ps1, packaging/windows/test-service.ps1 `
              -Destination $windows
          Compress-Archive -Path $package -DestinationPath (Join-Path $dist "$name.zip")
          .\packaging\windows\msi\test-version.ps1
          $msiOutput = Join-Path $env:RUNNER_TEMP 'msi-output'
          .\packaging\windows\msi\build.ps1 -Version $env:RELEASE_VERSION -BinaryPath $executable `
              -OutputDirectory $msiOutput
          .\packaging\windows\msi\inspect.ps1 -MsiPath (Join-Path $msiOutput "$name.msi") -Version $env:RELEASE_VERSION
          Copy-Item (Join-Path $msiOutput "$name.msi") -Destination $dist
      - name: Build and package Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
        run: |
          set -euo pipefail
          name="dscd-$RELEASE_VERSION-linux-amd64"
          package="$RUNNER_TEMP/$name"
          dist="$RUNNER_TEMP/release-dist"
          mkdir -p "$package/bin" "$package/docs" "$package/packaging" "$dist"
          go build -trimpath -o "$package/bin/dscd" ./cmd/dscd
          "$package/bin/dscd" -help
          cp README.md LICENSE AGENTS.md "$package/"
          cp docs/design.md "$package/docs/"
          cp -R packaging/systemd "$package/packaging/"
          tar -czf "$dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          GOBIN="$RUNNER_TEMP/package-tools" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$RUNNER_TEMP/package-tools" >> "$GITHUB_PATH"
      - name: Build and inspect native Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/build.sh "$RUNNER_TEMP/release-dist"
          bash packaging/linux/validate.sh "$RUNNER_TEMP/release-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: dscd-${{ matrix.platform }}-amd64
          path: ${{ runner.temp }}/release-dist/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dscd-*-amd64
          merge-multiple: true
          path: dist
      - name: Checksum release artifacts
        working-directory: dist
        run: |
          package_version="${RELEASE_VERSION#v}"
          package_version="${package_version/-rc./~rc.}"
          sha256sum "dscd-$RELEASE_VERSION-linux-amd64.tar.gz" \
            "dscd_${package_version}_amd64.deb" \
            "dscd-${package_version}-1.x86_64.rpm" \
            "dscd-$RELEASE_VERSION-windows-amd64.zip" \
            "dscd-$RELEASE_VERSION-windows-amd64.msi" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create tag and draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION")
          if [ -n "$existing" ]; then
            echo "::error::Tag $RELEASE_VERSION already exists; release tags must not be reused."
            exit 1
          fi
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" \
            "dist/dscd-$RELEASE_VERSION-linux-amd64.tar.gz" \
            "dist/dscd-$RELEASE_VERSION-windows-amd64.zip" \
            "dist/dscd-$RELEASE_VERSION-windows-amd64.msi" \
            dist/dscd_*.deb \
            dist/dscd-*.rpm \
            dist/SHA256SUMS \
            --verify-tag --draft --prerelease \
            --title "dscd $RELEASE_VERSION" --generate-notes \
            --notes "Built from $GITHUB_SHA. Linux amd64 DEB/RPM packages, Windows x64 MSI, and Linux/Windows amd64 archives include service assets and the MIT license. Native packages require Microsoft DSC >= 3.3.0 installed separately. On Windows, dsc.exe must be on the machine/system PATH visible to LocalSystem before installing dscd; reboot after PATH changes if needed. Install resources separately. This workflow inspects packages; installation tests run separately in the manual service-integration workflow."
