name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable release version
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: .\packaging\windows\msi\version.ps1 -Version $env:VERSION
      - name: Verify tagged source belongs to main
        id: source
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Refuse existing releases, including drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$VERSION" --silent 2>"$RUNNER_TEMP/release-error"; then
            echo "::error::Release $VERSION already exists; inspect it manually."
            exit 1
          elif ! grep -Fq '(HTTP 404)' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi

  build:
    needs: preflight
    uses: ./.github/workflows/ci.yaml
    with:
      version: ${{ github.ref_name }}
      commit: ${{ needs.preflight.outputs.commit }}

  integration:
    needs: [preflight, build]
    uses: ./.github/workflows/service-integration.yaml
    with:
      version: ${{ github.ref_name }}
      commit: ${{ needs.preflight.outputs.commit }}

  draft:
    needs: [preflight, build, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      # Defaults scope these downloads to this invoking release run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dscd-linux-amd64
          path: dist/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dscd-windows-amd64
          path: dist/windows
      - name: Verify exact release assets and checksums
        run: |
          package_version="${VERSION#v}"
          expected=("dscd-$VERSION-linux-amd64.tar.gz" "dscd_${package_version}_amd64.deb"
                    "dscd-${package_version}-1.x86_64.rpm" "dscd-$VERSION-windows-amd64.zip"
                    "dscd-$VERSION-windows-amd64.msi")
          diff <(printf '%s\n' "${expected[@]}" | sort) \
               <(find dist -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          (cd dist/linux && sha256sum --check --strict SHA256SUMS)
          (cd dist/windows && sha256sum --check --strict SHA256SUMS)
          cat dist/linux/SHA256SUMS dist/windows/SHA256SUMS > dist/SHA256SUMS
          diff <(printf '%s\n' "${expected[@]}" | sort) <(cut -c 67- dist/SHA256SUMS | sort)
          cp dist/linux/*.tar.gz dist/linux/*.deb dist/linux/*.rpm dist/windows/*.zip dist/windows/*.msi dist/
      - name: Recheck tag and release
        run: |
          git fetch --no-tags origin "refs/tags/$VERSION"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$COMMIT"
          if gh api "repos/$GH_REPO/releases/tags/$VERSION" --silent 2>"$RUNNER_TEMP/release-error"; then
            echo "::error::Release $VERSION already exists; it will not be overwritten."
            exit 1
          elif ! grep -Fq '(HTTP 404)' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
      - name: Create draft release
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/*.msi dist/*.deb dist/*.rpm dist/SHA256SUMS \
            --verify-tag --draft --title "dscd $VERSION" --generate-notes \
            --notes "Version $VERSION, built from $COMMIT. These exact packages passed fresh-install, reconciliation, service lifecycle and uninstall checks on Windows and Ubuntu, and RPM lifecycle checks in Fedora without systemd. Automated upgrade testing is deferred. Microsoft DSC 3.3.0+ must be installed separately; Windows requires dsc.exe on the machine PATH visible to LocalSystem. Review this draft before publishing."
