name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  WIX_VERSION: '7.0.0'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows race compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          "CGO_ENABLED=1" >> $env:GITHUB_ENV
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) { $unformatted; throw 'Run gofmt on the files above.' }
      - name: Race
        run: go test -race ./...
      - name: Build and inspect Windows MSI (no installation)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\dscd.exe" ./cmd/dscd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\windows\msi\test-version.ps1
          .\packaging\windows\msi\build.ps1 -Version v0.0.1-rc.1 `
              -BinaryPath "$env:RUNNER_TEMP\dscd.exe" -OutputDirectory "$env:RUNNER_TEMP\dscd-msi" `
              -WixVersion $env:WIX_VERSION -AcceptWixEula
          .\packaging\windows\msi\inspect.ps1 `
              -MsiPath "$env:RUNNER_TEMP\dscd-msi\dscd-v0.0.1-rc.1-windows-amd64.msi" -Version v0.0.1-rc.1
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          GOBIN="$RUNNER_TEMP/package-tools" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$RUNNER_TEMP/package-tools" >> "$GITHUB_PATH"
      - name: Build and inspect Linux packages (no installation)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: v0.0.0-rc.1
        run: |
          bash packaging/linux/build.sh "$RUNNER_TEMP/packages"
          bash packaging/linux/validate.sh "$RUNNER_TEMP/packages"
