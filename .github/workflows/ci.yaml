name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows race compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          "CGO_ENABLED=1" >> $env:GITHUB_ENV
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) { $unformatted; throw 'Run gofmt on the files above.' }
      - name: Race
        run: go test -race ./...
      - name: Build and inspect Windows MSI (no installation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\dscd.exe" ./cmd/dscd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\windows\msi\test-version.ps1
          .\packaging\windows\msi\build.ps1 -Version v0.0.1-rc.1 `
              -BinaryPath "$env:RUNNER_TEMP\dscd.exe" -OutputPath "$env:RUNNER_TEMP\dscd.msi"
          .\packaging\windows\msi\inspect.ps1 -Path "$env:RUNNER_TEMP\dscd.msi" -Version v0.0.1-rc.1
