name: build-and-test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version || 'v0.0.0' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate version mapping
        shell: pwsh
        run: |
          .\packaging\windows\msi\version.ps1 -Version $env:RELEASE_VERSION
          .\packaging\windows\msi\test-version.ps1
      - name: Install Windows race compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          "CGO_ENABLED=1" >> $env:GITHUB_ENV
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) { $unformatted; throw 'Run gofmt on the files above.' }
      - name: Race
        run: go test -race ./...
      - name: Build and inspect Windows packages (no installation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1 -Version $env:RELEASE_VERSION -OutputDirectory "$env:RUNNER_TEMP\dist"
          .\packaging\windows\msi\inspect.ps1 `
              -MsiPath "$env:RUNNER_TEMP\dist\dscd-$env:RELEASE_VERSION-windows-amd64.msi" -Version $env:RELEASE_VERSION
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          GOBIN="$RUNNER_TEMP/package-tools" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$RUNNER_TEMP/package-tools" >> "$GITHUB_PATH"
      - name: Build and inspect Linux packages (no installation)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          bash packaging/linux/build.sh "$RUNNER_TEMP/dist"
          bash packaging/linux/validate.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.commit != ''
        with:
          name: dscd-${{ matrix.platform }}-amd64
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          overwrite: true
