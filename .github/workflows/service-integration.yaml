name: service-integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: Test-only stable version (does not create a release)
        type: string
        required: true
        default: v0.0.0
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      commit:
        type: string
        required: true

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  service:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Validate version
        shell: pwsh
        run: .\packaging\windows\msi\version.ps1 -Version $env:RELEASE_VERSION
      # Only manual runs build. Release calls use the caller's uploaded packages.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: github.event_name == 'workflow_dispatch'
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and inspect manual Windows packages
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1 -Version $env:RELEASE_VERSION -OutputDirectory "$env:RUNNER_TEMP\dist"
          .\packaging\windows\msi\inspect.ps1 `
              -MsiPath "$env:RUNNER_TEMP\dist\dscd-$env:RELEASE_VERSION-windows-amd64.msi" -Version $env:RELEASE_VERSION `
              -ArchivePath "$env:RUNNER_TEMP\dist\dscd-$env:RELEASE_VERSION-windows-amd64.zip"
      - name: Build and inspect manual Linux packages
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          GOBIN="$RUNNER_TEMP/package-tools" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export PATH="$RUNNER_TEMP/package-tools:$PATH"
          bash packaging/linux/build.sh "$RUNNER_TEMP/dist"
          bash packaging/linux/validate.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dscd-${{ matrix.platform }}-amd64
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          overwrite: true
      # No token/run-id override: reusable calls download from the invoking run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dscd-${{ matrix.platform }}-amd64
          path: ${{ runner.temp }}/packages
      - name: Verify downloaded packages
        shell: bash
        working-directory: ${{ runner.temp }}/packages
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ "$RUNNER_OS" == Windows ]]; then
            expected=("dscd-$VERSION-windows-amd64.msi" "dscd-$VERSION-windows-amd64.zip")
          else
            expected=("dscd-$VERSION-linux-amd64.tar.gz" "dscd_${VERSION#v}_amd64.deb" "dscd-${VERSION#v}-1.x86_64.rpm")
          fi
          diff <(printf '%s\n' "${expected[@]}" SHA256SUMS | sort) <(find . -type f -printf '%P\n' | sort)
          diff <(printf '%s\n' "${expected[@]}" | sort) <(cut -c 67- SHA256SUMS | sort)
          sha256sum --check --strict SHA256SUMS
          echo "Verified release payloads from invoking run $GITHUB_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
      - name: Windows MSI lifecycle and reconciliation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\packaging\windows\msi\test-install.ps1 -Disposable `
              -MsiPath "$env:RUNNER_TEMP\packages\dscd-$env:RELEASE_VERSION-windows-amd64.msi" `
              -Version $env:RELEASE_VERSION -ArchivePath "$env:RUNNER_TEMP\packages\dscd-$env:RELEASE_VERSION-windows-amd64.zip"
      - name: Debian lifecycle and reconciliation with real systemd
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/dsc.deb" \
            https://github.com/PowerShell/DSC/releases/download/v3.3.0/dsc_3.3.0-1_amd64.deb
          echo "af949cd0dd27a573fd74c926edf57b9d2136063f361f11af88738e2df32487c8  $RUNNER_TEMP/dsc.deb" | sha256sum --check
          sudo apt-get install -y "$RUNNER_TEMP/dsc.deb"
          sudo env VERSION="$RELEASE_VERSION" bash packaging/linux/test-install.sh \
            "$RUNNER_TEMP/packages/dscd_${RELEASE_VERSION#v}_amd64.deb"
      - name: Fedora RPM lifecycle without systemd
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/dsc.rpm" \
            https://github.com/PowerShell/DSC/releases/download/v3.3.0/dsc-3.3.0-1.x86_64.rpm
          echo "09ac4c3c5aeaaec96cdb128a2fe55cd022a31b5ae67d0c77d01e241761708c47  $RUNNER_TEMP/dsc.rpm" | sha256sum --check
          docker run --rm -e VERSION="$RELEASE_VERSION" \
            -v "$RUNNER_TEMP/dsc.rpm:/dsc.rpm:ro" \
            -v "$RUNNER_TEMP/packages:/packages:ro" \
            -v "$GITHUB_WORKSPACE/packaging/linux:/tests:ro" \
            fedora:43 bash -euc '
              dnf install -y /dsc.rpm
              bash /tests/test-install.sh "/packages/dscd-${VERSION#v}-1.x86_64.rpm"
            ' 2>&1 | tee "$RUNNER_TEMP/rpm-install.log"
      - name: Collect Linux diagnostics
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sudo journalctl -u dscd --no-pager > "$RUNNER_TEMP/dscd-journal.log"
          sudo cp /var/log/apt/term.log "$RUNNER_TEMP/apt-install.log"
          sudo chmod a+r "$RUNNER_TEMP/apt-install.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.platform }}-install-logs
          path: |
            packaging/windows/msi/test-output/**/*.log
            ${{ runner.temp }}/*-install.log
            ${{ runner.temp }}/dscd-journal.log
          if-no-files-found: ignore
          overwrite: true
      - name: Record validation scope
        shell: bash
        run: |
          echo "Fresh-install, lifecycle and uninstall checks passed. Automated upgrade testing is deferred; no synthetic baseline was built." >> "$GITHUB_STEP_SUMMARY"
