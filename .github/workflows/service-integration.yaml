name: service-integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows SCM integration (disposable runner only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o bin\dscd.exe .\cmd\dscd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\windows\test-service.ps1 -BinaryPath .\bin\dscd.exe
      - name: Linux systemd integration (disposable runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go build -o bin/dscd ./cmd/dscd
          root=$(mktemp -d '/tmp/dscd service test.XXXXXX')
          unit="dscd-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'sudo systemctl stop "$unit" || true; rm -f "$root/dscd"; rmdir "$root/input" "$root/results" "$root"' EXIT
          mkdir "$root/input" "$root/results"
          cp bin/dscd "$root/dscd"
          sudo systemd-run --unit="$unit" --property=KillMode=control-group --property=TimeoutStopSec=40s \
            "$root/dscd" -config-dir "$root/input" -results-dir "$root/results" -dsc-path "$root/dscd"
          for i in $(seq 1 50); do
            if sudo journalctl -u "$unit" --no-pager | grep -q 'dscd started'; then break; fi
            sleep 0.1
          done
          sudo systemctl is-active --quiet "$unit"
          sudo journalctl -u "$unit" --no-pager | grep -q 'dscd started'
          sudo systemctl stop "$unit"
          sudo journalctl -u "$unit" --no-pager | grep -q 'dscd stopped'
