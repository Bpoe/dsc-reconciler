name: service-integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows MSI integration (disposable runner only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o bin\dscd.exe .\cmd\dscd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\windows\msi\build.ps1 -Version v0.0.1-rc.1 `
              -BinaryPath .\bin\dscd.exe -OutputPath "$env:RUNNER_TEMP\dscd.msi"
          .\packaging\windows\msi\inspect.ps1 -Path "$env:RUNNER_TEMP\dscd.msi" -Version v0.0.1-rc.1
          $dscRoot = Join-Path $env:ProgramFiles 'DSC smoke test'
          $archive = Join-Path $env:RUNNER_TEMP 'dsc.zip'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/DSC/releases/download/v3.3.0/DSC-3.3.0-x86_64-pc-windows-msvc.zip' `
              -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dscRoot
          $dsc = Join-Path $dscRoot 'dsc.exe'
          & $dsc --version
          if ($LASTEXITCODE -ne 0) { throw 'DSC prerequisite does not run.' }
          .\packaging\windows\msi\test-install.ps1 -MsiPath "$env:RUNNER_TEMP\dscd.msi" -DSCPath $dsc
      - name: Preserve Windows MSI logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-logs
          path: ${{ runner.temp }}/dscd-msi-logs/*
          if-no-files-found: ignore
      - name: Linux systemd integration (disposable runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go build -o bin/dscd ./cmd/dscd
          root=$(mktemp -d '/tmp/dscd service test.XXXXXX')
          unit="dscd-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'sudo systemctl stop "$unit" || true; rm -f "$root/dscd"; rmdir "$root/input" "$root/results" "$root"' EXIT
          mkdir "$root/input" "$root/results"
          cp bin/dscd "$root/dscd"
          sudo systemd-run --unit="$unit" --property=KillMode=control-group --property=TimeoutStopSec=40s \
            "$root/dscd" -config-dir "$root/input" -results-dir "$root/results" -dsc-path "$root/dscd"
          for i in $(seq 1 50); do
            if sudo journalctl -u "$unit" --no-pager | grep -q 'dscd started'; then break; fi
            sleep 0.1
          done
          sudo systemctl is-active --quiet "$unit"
          sudo journalctl -u "$unit" --no-pager | grep -q 'dscd started'
          sudo systemctl stop "$unit"
          sudo journalctl -u "$unit" --no-pager | grep -q 'dscd stopped'
