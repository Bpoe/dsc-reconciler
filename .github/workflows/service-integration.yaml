name: service-integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows SCM integration (disposable runner only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o bin\dscd.exe .\cmd\dscd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\windows\test-service.ps1 -BinaryPath .\bin\dscd.exe
      - name: Build Linux packages (disposable runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm cpio
          GOBIN="$RUNNER_TEMP/package-tools" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export PATH="$RUNNER_TEMP/package-tools:$PATH"
          for version in v0.0.0-rc.1 v0.0.0; do
            VERSION="$version" bash packaging/linux/build.sh "$RUNNER_TEMP/packages"
            VERSION="$version" bash packaging/linux/validate.sh "$RUNNER_TEMP/packages"
          done
      - name: Debian package lifecycle with real systemd
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output "$RUNNER_TEMP/dsc.deb" \
            https://github.com/PowerShell/DSC/releases/download/v3.3.0/dsc_3.3.0-1_amd64.deb
          echo "af949cd0dd27a573fd74c926edf57b9d2136063f361f11af88738e2df32487c8  $RUNNER_TEMP/dsc.deb" | sha256sum --check
          sudo apt-get install -y "$RUNNER_TEMP/dsc.deb"
          sudo bash packaging/linux/test-install.sh \
            "$RUNNER_TEMP/packages/dscd_0.0.0~rc.1_amd64.deb" \
            "$RUNNER_TEMP/packages/dscd_0.0.0_amd64.deb"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-install-packages
          path: ${{ runner.temp }}/packages/*.rpm
          if-no-files-found: error

  rpm-install:
    needs: service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-install-packages
          path: ${{ runner.temp }}/packages
      - name: RPM package lifecycle without systemd (image construction)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output "$RUNNER_TEMP/packages/dsc.rpm" \
            https://github.com/PowerShell/DSC/releases/download/v3.3.0/dsc-3.3.0-1.x86_64.rpm
          echo "09ac4c3c5aeaaec96cdb128a2fe55cd022a31b5ae67d0c77d01e241761708c47  $RUNNER_TEMP/packages/dsc.rpm" | sha256sum --check
          docker run --rm \
            -v "$RUNNER_TEMP/packages:/packages:ro" \
            -v "$GITHUB_WORKSPACE/packaging/linux:/tests:ro" \
            fedora:43 bash -euc '
              dnf install -y /packages/dsc.rpm
              bash /tests/test-install.sh \
                /packages/dscd-0.0.0~rc.1-1.x86_64.rpm \
                /packages/dscd-0.0.0-1.x86_64.rpm
            '
