name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows race compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          "CGO_ENABLED=1" >> $env:GITHUB_ENV
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) { $unformatted; throw 'Run gofmt on the files above.' }
      - name: Race
        run: go test -race ./...
      - name: Windows SCM integration (disposable runner only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o bin\dscd.exe .\cmd\dscd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\windows\test-service.ps1 -BinaryPath .\bin\dscd.exe
      - name: Linux systemd integration (disposable runner only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go build -o bin/dscd ./cmd/dscd
          root=$(mktemp -d '/tmp/dscd service test.XXXXXX')
          unit="dscd-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'sudo systemctl stop "$unit" || true; rm -f "$root/dscd"; rmdir "$root/input" "$root/results" "$root"' EXIT
          mkdir "$root/input" "$root/results"
          cp bin/dscd "$root/dscd"
          sudo systemd-run --unit="$unit" --property=KillMode=control-group --property=TimeoutStopSec=40s \
            "$root/dscd" -config-dir "$root/input" -results-dir "$root/results" -dsc-path "$root/dscd"
          for i in $(seq 1 50); do
            if sudo journalctl -u "$unit" --no-pager | grep -q 'dscd started'; then break; fi
            sleep 0.1
          done
          sudo systemctl is-active --quiet "$unit"
          sudo journalctl -u "$unit" --no-pager | grep -q 'dscd started'
          sudo systemctl stop "$unit"
          sudo journalctl -u "$unit" --no-pager | grep -q 'dscd stopped'
